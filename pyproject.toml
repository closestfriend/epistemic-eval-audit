[project]
name = "epistemic-eval-audit"
version = "0.1.0"
description = "Auditing the Epistemic Auditors: Scorer Red-Teaming, Judge Meta-Evaluation, and Hardened Inspect AI Harnesses for MASK, SycEval, and DarkBench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "inspect-ai>=0.3.40",
    "pydantic>=2.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "datasets>=2.18",
    "pandas>=2.2",
    "google-genai>=1.0",
    "anthropic>=0.40",
    "openai>=1.50",
    "adaption>=0.16.0",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["targets", "verifier", "harness", "experiments"]
